# Alerts for the chatbot (Phase 8). They show as firing in Prometheus (http://localhost:9091/alerts)
# and on the Grafana dashboard. This is a one-host demo with no on-call, so nothing pages:
# add an Alertmanager with a receiver to send them somewhere.
groups:
  - name: chatbot
    rules:
      - alert: ChatbotDown
        expr: up{job="chatbot"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Prometheus can't scrape the API
          description: "/metrics hasn't answered for 2 minutes: the API is down or unreachable."

      - alert: ChatbotErrorRate
        # 500s, plus streamed runs that ended in an error event (they answer 200).
        expr: |
          (
            (sum(rate(chatbot_http_requests_total{status=~"5.."}[5m])) or vector(0))
            + (sum(rate(chatbot_run_errors_total{kind="internal"}[5m])) or vector(0))
          )
          / sum(rate(chatbot_http_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: More than 5% of requests are failing
          description: "{{ $value | humanizePercentage }} of requests failed over 5 minutes."

      - alert: ChatbotSlowFirstToken
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(chatbot_time_to_first_token_seconds_bucket[10m]))) > 15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Replies are slow to start
          description: "p95 time to first token is {{ $value | humanizeDuration }} (over 15 s)."

      - alert: ChatbotSlowModel
        expr: |
          histogram_quantile(0.95, sum by (le, model) (rate(chatbot_model_call_duration_seconds_bucket[10m]))) > 20
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Model {{ $labels.model }} is slow"
          description: "p95 model call is {{ $value | humanizeDuration }} (over 20 s): the gateway is struggling."

      - alert: ChatbotModelErrors
        expr: |
          sum by (model) (rate(chatbot_model_call_errors_total[10m]))
          / sum by (model) (rate(chatbot_model_call_duration_seconds_count[10m]) + rate(chatbot_model_call_errors_total[10m]))
          > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Calls to {{ $labels.model }} are failing"
          description: "{{ $value | humanizePercentage }} of model calls raised over 10 minutes."

      - alert: ChatbotTokenSpike
        # Cost: the last hour's tokens against the hourly average of the day before it. Ignores
        # quiet hours (under 100k tokens), where a few chats would be a "spike".
        expr: |
          sum(increase(chatbot_model_tokens_total[1h])) > 3 * sum(increase(chatbot_model_tokens_total[1d] offset 1h)) / 24
          and sum(increase(chatbot_model_tokens_total[1h])) > 100000
        labels: {severity: warning}
        annotations:
          summary: Token use is 3x the usual rate
          description: "{{ $value | humanize }} tokens in the last hour. Check for a looping run or one user's traffic (DAILY_TOKEN_BUDGET caps each)."

      - alert: ChatbotPIIInReplies
        # PIIMiddleware redacts these before the reply is stored, and the stream redactor before
        # it's shown; the model writing PII at all means a tool result or memory let it through.
        expr: sum by (type) (increase(chatbot_pii_redactions_total{source="reply"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "The model wrote PII ({{ $labels.type }}) in a reply"
          description: "It was redacted, but find the run in Langfuse to see where it came from."
