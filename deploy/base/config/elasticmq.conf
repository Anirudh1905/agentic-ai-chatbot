# ElasticMQ, standing in for Amazon SQS (Phase 9). The queues memory pushes go through
# (chatbot/jobs): a FIFO queue grouped by user, and its dead-letter queue after 5 receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  "memory-pushes-dlq.fifo" {
    fifo = true
  }
  "memory-pushes.fifo" {
    fifo = true
    # Longer than a push's worst case: two memory-model calls, each retried within
    # REQUEST_TIMEOUT. A push that isn't acked by then is delivered again.
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "memory-pushes-dlq.fifo"
      maxReceiveCount = 5
    }
  }
}

# Messages survive a restart, as on SQS (a volume in the cluster).
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}
