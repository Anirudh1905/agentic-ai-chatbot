[project]
name = "chatbot"
version = "0.1.0"
description = "Agentic chatbot with RAG, web search, HITL, PII masking and memory"
authors = [
    { name = "Anirudh1905", email = "anirudhsridhar1905@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "ddgs>=9.16.0",
    "email-validator>=2.2",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "limits[async-redis]>=5",
    "markdownify>=1.2.3",
    "pgvector>=0.5.1",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.3.6",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.4",
    "sse-starlette>=3.5.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
ui = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "streamlit>=1.65.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Batch CLI: blocking file access inside async code is fine here.
"src/chatbot/ingestion/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sse_starlette.*", "langfuse.*", "ddgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (see tests/integration)"]
# pymupdf's SWIG bindings warn on import under Python 3.12.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
