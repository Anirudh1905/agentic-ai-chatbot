include:
  - ops/langfuse/docker-compose.yml

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 5s
      retries: 10

  # Rate limits and daily token budgets (src/chatbot/accounts/limits.py), shared by every API process.
  # Counters only: nothing here needs to survive a restart, so no volume. Port 6380 so it
  # doesn't clash with a local Redis on 6379.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # The queue memory pushes go through (chatbot/jobs), standing in for Amazon SQS: a FIFO queue
  # grouped by user and its dead-letter queue (ops/elasticmq/elasticmq.conf). Messages are kept
  # on a volume, so queued pushes survive a restart.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./ops/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmqdata:/data
    ports:
      - "127.0.0.1:${ELASTICMQ_PORT:-9324}:9324"

  # Web UI for browsing the database: chunks, threads, checkpoints. Local dev only.
  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://chatbot:chatbot@postgres:5432/chatbot?sslmode=disable
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # Metrics (Phase 8): scrapes the API's /metrics and evaluates ops/prometheus/alerts.yml.
  # 9091 on the host: Langfuse's MinIO has 9090.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  # Dashboards: the "Chatbot" dashboard (ops/grafana/dashboards) opens without a login, read
  # only; sign in as admin/admin to edit. 3001 on the host: Langfuse has 3000.
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chatbot.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  elasticmqdata:
  promdata:
  grafanadata:
